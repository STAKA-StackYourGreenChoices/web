name: release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Maintains a release PR with the computed semver bump and changelog.
      # Merging that PR cuts the tag, which is what triggers production.yml.
      - uses: googleapis/release-please-action@v4
        with:
          release-type: node
