name: production

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      sha:
        description: 'Short SHA to deploy (for rollback)'
        required: true

concurrency:
  group: deploy-production-web
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://app.yourdomain.com
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: vars
        run: |
          SHA="${{ inputs.sha }}"
          if [ -z "$SHA" ]; then SHA="$(git rev-parse --short HEAD)"; fi
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"

      # NOTE: unlike the API, web CANNOT promote the staging image — the staging
      # API URL is baked into its client bundle. Production gets its own build.
      # To make web promotable, stop using NEXT_PUBLIC_API_URL in client code and
      # proxy through a same-origin Route Handler using a server-side API_URL.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository_owner }}/web:${{ steps.vars.outputs.sha }}-prod
            ghcr.io/${{ github.repository_owner }}/web:production
            ghcr.io/${{ github.repository_owner }}/web:${{ github.ref_name }}
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.yourdomain.com
            NEXT_PUBLIC_APP_ENV=production
            GIT_SHA=${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/web:buildcache
          provenance: false

      - name: Deploy
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_ed25519 deploy@${{ secrets.DEPLOY_HOST }} \
            "deploy-production web ${{ steps.vars.outputs.sha }}-prod"
