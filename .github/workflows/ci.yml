name: ci

on:
  pull_request:
  push: { branches: [main] }

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    name: lint + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:ci
      - run: pnpm typecheck

  test-unit:
    name: test-unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:cov
      - uses: codecov/codecov-action@v5
        if: ${{ !cancelled() }}
        continue-on-error: true
        with: { files: ./coverage/lcov.info, token: '${{ secrets.CODECOV_TOKEN }}' }

  test-e2e:
    name: test-e2e
    runs-on: ubuntu-latest
    # Pinned to the installed Playwright version so browser binaries and font
    # rendering match the machine that generates visual baselines.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    env:
      HOME: /root # Playwright image quirk
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Run Playwright
        run: pnpm playwright test
        env:
          NEXT_PUBLIC_API_URL: https://api-staging.yourdomain.com
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  docker-build:
    name: build
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write, security-events: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        run: |
          SHA="$(git rev-parse --short HEAD)"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "tag=pr-${{ github.event.pull_request.number }}-${SHA}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${SHA}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ghcr.io/${{ github.repository_owner }}/web:${{ steps.meta.outputs.tag }}
          build-args: |
            NEXT_PUBLIC_API_URL=https://api-staging.yourdomain.com
            NEXT_PUBLIC_APP_ENV=ci
            GIT_SHA=${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/web:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/web:buildcache,mode=max
          provenance: false

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/web:${{ steps.meta.outputs.tag }}
          format: sarif
          output: trivy.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with: { sarif_file: trivy.sarif }
