name: staging

on:
  push:
    branches: [main]

concurrency:
  group: deploy-staging-web
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.yourdomain.com
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: vars
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository_owner }}/web:${{ steps.vars.outputs.sha }}
            ghcr.io/${{ github.repository_owner }}/web:staging
          build-args: |
            NEXT_PUBLIC_API_URL=https://api-staging.yourdomain.com
            NEXT_PUBLIC_APP_ENV=staging
            GIT_SHA=${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/web:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/web:buildcache,mode=max
          provenance: false

      - name: Deploy
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_ed25519 deploy@${{ secrets.DEPLOY_HOST }} \
            "deploy-staging web ${{ steps.vars.outputs.sha }}"
