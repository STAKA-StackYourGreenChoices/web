name: preview

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]

concurrency:
  group: preview-web-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  pull-requests: write

jobs:
  deploy:
    name: preview-deploy
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.pull_request.draft == false ||
       contains(github.event.pull_request.labels.*.name, 'preview'))
    runs-on: ubuntu-latest
    environment:
      name: preview
      url: https://pr-${{ github.event.pull_request.number }}-web.preview.yourdomain.com
    steps:
      - uses: actions/checkout@v4

      # ── Cross-repo pinning ────────────────────────────────────────────
      # Default: build against the staging API.
      # Override: put `api=pr-42` in the PR body, or add an `api=pr-42` label.
      - name: Resolve API base URL
        id: api
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          PIN="$(printf '%s\n%s' "$PR_BODY" "$LABELS" \
                 | grep -oE 'api=pr-[0-9]+' | head -1 | grep -oE '[0-9]+$' || true)"
          if [ -n "$PIN" ]; then
            echo "url=https://pr-${PIN}-api.preview.yourdomain.com" >> "$GITHUB_OUTPUT"
            echo "note=pinned to API PR #${PIN}" >> "$GITHUB_OUTPUT"
          else
            echo "url=https://api-staging.yourdomain.com" >> "$GITHUB_OUTPUT"
            echo "note=staging API (default)" >> "$GITHUB_OUTPUT"
          fi

      - id: vars
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # NEXT_PUBLIC_* is inlined at build time — hence one image per preview.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ghcr.io/${{ github.repository_owner }}/web:pr-${{ github.event.pull_request.number }}-${{ steps.vars.outputs.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ steps.api.outputs.url }}
            NEXT_PUBLIC_APP_ENV=preview
            GIT_SHA=${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/web:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/web:buildcache,mode=max
          provenance: false

      - name: Deploy preview
        id: deploy
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          URL=$(ssh -i ~/.ssh/id_ed25519 deploy@${{ secrets.DEPLOY_HOST }} \
            "preview-up ${{ github.event.pull_request.number }} ${{ steps.vars.outputs.sha }} web ${{ steps.api.outputs.url }}" \
            | tail -1)
          echo "url=${URL}" >> "$GITHUB_OUTPUT"

      - name: Smoke test against the live preview
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
          PLAYWRIGHT_HTTP_CREDENTIALS: preview:${{ secrets.PREVIEW_BASIC_AUTH_PASSWORD }}
        run: |
          docker run --rm \
            -v "$PWD:/work" -w /work \
            -e PREVIEW_URL -e PLAYWRIGHT_HTTP_CREDENTIALS -e CI=true -e HOME=/root \
            mcr.microsoft.com/playwright:v1.62.1-noble \
            sh -c 'corepack enable && pnpm install --frozen-lockfile && pnpm playwright test --grep @smoke'

      - name: Lighthouse budget
        continue-on-error: true
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: ${{ steps.deploy.outputs.url }}
          budgetPath: ./lighthouse-budget.json
          uploadArtifacts: true

      - uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: preview-web
          message: |
            ### 🎨 Web preview is live

            | | |
            |---|---|
            | **URL** | ${{ steps.deploy.outputs.url }} |
            | **API** | `${{ steps.api.outputs.url }}` — ${{ steps.api.outputs.note }} |
            | **Commit** | `${{ steps.vars.outputs.sha }}` |

            Basic auth: `preview` / _see the team password manager_.

            <sub>Testing a change that spans both repos? Add `api=pr-&lt;number&gt;` to this PR's description and push again.</sub>

      - name: Report failure on the PR
        if: failure()
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: preview-web
          message: |
            ### ❌ Web preview failed to deploy
            [View the run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
